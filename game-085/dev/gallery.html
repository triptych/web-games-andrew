<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderQuest — gallery</title>
<style>
  body { margin: 0; background: #6a6a70; font: 12px system-ui, sans-serif; color: #fff; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Every monster, Warden, cart and roadside prop on a neutral background, at a readable size.
// ?night=1 draws them as they look at night.
import { FAMILIES, REGIONS, CLASSES } from '../js/sim/data.js';
import { drawCreature } from '../js/view/creatures.js';
import { drawProp, drawCart, drawWalker, drawHouse, shade } from '../js/view/sprites.js';

const night = new URLSearchParams(location.search).get('night') === '1';
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = 1400, H = 1500;
c.width = W; c.height = H;
ctx.fillStyle = night ? '#1a1c2c' : '#7a7a80'; ctx.fillRect(0, 0, W, H);
ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
const label = (t, x, y) => { ctx.fillStyle = '#fff'; ctx.fillText(t, x, y); };

// monsters: 9 per row
const fams = Object.entries(FAMILIES);
fams.forEach(([id, f], i) => {
    const x = 80 + (i % 9) * 150, y = 190 + Math.floor(i / 9) * 210;
    drawCreature(ctx, { ...f, shape: f.shape }, x, y, 0.2, { t: 0.3, flash: 0, dead: 0 }, night);
    label(f.name, x, y + 20);
});
// wardens
REGIONS.forEach((R, i) => {
    const x = 110 + i * 220, y = 990;
    drawCreature(ctx, { shape: R.warden.shape, col: R.warden.col, deco: R.warden.deco, warden: true }, x, y, 0.32, { t: 0.3, flash: 0, dead: 0 }, night);
    label(R.warden.name, x, y + 20);
});
// carts and their travellers, seen from behind and to the right like the game's camera
const classes = Object.keys(CLASSES);
classes.forEach((cls, i) => {
    const ox = 90 + i * 150, oy = 1230;
    const P = (x, y, z) => { const s = 0.16 * 3000 / (3000 + z); return { X: ox + (x - 260) * s, Y: oy - y * s - z * 0.03, s }; };
    const C = CLASSES[cls];
    drawCart(ctx, P, { cls, color: cls === 'captain' ? '#8a5a34' : shade(C.color, -0.35), cloth: cls === 'captain' ? '#e8dcc0' : C.cloth, x: 0, z: 0, w: 460, h: 640, len: 620, wheel: 0.4, lead: cls === 'captain' }, night, 0.5);
    drawWalker(ctx, ox + 60, oy + 10, 0.12, cls, C.color, C.cloth, 0.6, night, i % 2);
    label(C.name, ox, oy + 30);
});
// props
const props = ['tree', 'bush', 'fence', 'cactus', 'rock', 'dune', 'willow', 'mushroom', 'reeds', 'pine', 'deadtree', 'lavarock', 'vent', 'crystal', 'obelisk', 'waystone'];
props.forEach((k, i) => { const x = 50 + i * 84, y = 1440; drawProp(ctx, k, x, y, 0.08, 1, night); label(k, x, y + 16); });
drawHouse(ctx, 1380, 1440, 0.07, 5, { walls: ['#e8dcc0'], roofs: ['#a84a3a'] }, night);
document.title += ' ✓';
</script>
</body>
</html>
