<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <script src="../lib/page-audio.js"></script>
    <title>Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 48px 8px 12px;
            background: linear-gradient(to bottom, #0a0a1a, #1a1a3a);
            font-family: Arial, sans-serif;
            color: white;
        }

        /* The game draws at 800×600; CSS scales it to whatever fits. */
        #gameCanvas {
            display: block;
            width: min(800px, 100%, (100dvh - 150px) * 4 / 3);
            aspect-ratio: 4 / 3;
            height: auto;
            border: 2px solid #4a4a6a;
            background: #000;
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.3);
            touch-action: none;       /* drag to steer without scrolling the page */
            cursor: crosshair;
        }

        #ui {
            margin-top: 12px;
            text-align: center;
        }

        #score {
            font-size: 24px;
            margin-bottom: 4px;
        }

        #best {
            font-size: 14px;
            color: #aaa;
        }

        #gameOver {
            display: none;
            font-size: 32px;
            color: #ff4444;
            margin-top: 12px;
        }

        #restartBtn {
            display: none;
            margin: 12px auto 0;
            min-height: 44px;
            padding: 10px 30px;
            font-size: 18px;
            background: #4a4aff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #restartBtn:hover {
            background: #6a6aff;
        }

        #controls {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <a href="../index.html" style="position:fixed;top:8px;left:8px;z-index:99999;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#fff;background:rgba(0,0,0,0.55);padding:6px 12px;border-radius:6px;text-decoration:none;pointer-events:auto;border:1px solid rgba(255,255,255,0.25);" onmouseover="this.style.background='rgba(0,0,0,0.8)'" onmouseout="this.style.background='rgba(0,0,0,0.55)'">← Games</a>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="best">Best: 0</div>
        <div id="gameOver">GAME OVER</div>
        <button id="restartBtn">Restart Game</button>
        <div id="controls">
            Arrow keys or A/D to move · Hold Space to shoot · P to pause
        </div>
    </div>
    <script>
        // Web Audio API - Sound Effects Module
        const SoundFX = {
            audioContext: null,

            // Created on first use rather than at load, so it starts after a
            // user gesture and the browser lets it play.
            init() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            },

            // Resume audio context (required for some browsers)
            resume() {
                this.init();
                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }
            },

            // Laser shoot sound
            shoot() {
                this.resume();
                const ctx = this.audioContext;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            },

            // Explosion sound (enemy hit)
            explosion() {
                this.resume();
                const ctx = this.audioContext;

                // Create noise for explosion
                const bufferSize = ctx.sampleRate * 0.3;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.3, ctx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

                const noiseFilter = ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(1000, ctx.currentTime);
                noiseFilter.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start();
                noise.stop(ctx.currentTime + 0.3);

                // Add bass thump
                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(100, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);

                oscGain.gain.setValueAtTime(0.4, ctx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);

                osc.connect(oscGain);
                oscGain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            },

            // Player death sound
            playerDeath() {
                this.resume();
                const ctx = this.audioContext;

                // Descending dramatic tone
                const notes = [500, 400, 300, 200, 100];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + i * 0.15 + 0.15);

                    gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.1 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.2);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.2);
                });

                // Add explosion noise
                const bufferSize = ctx.sampleRate * 0.5;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.3, ctx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

                const noiseFilter = ctx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.setValueAtTime(800, ctx.currentTime);
                noiseFilter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.5);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start();
                noise.stop(ctx.currentTime + 0.5);
            },

            // Power-up/score milestone sound
            powerUp() {
                this.resume();
                const ctx = this.audioContext;

                // Ascending arpeggio
                const notes = [400, 500, 600, 800];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);

                    gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.05);
                    gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + i * 0.05 + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.05 + 0.15);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.05);
                    osc.stop(ctx.currentTime + i * 0.05 + 0.15);
                });
            },

            // Enemy spawn sound (subtle)
            enemySpawn() {
                this.resume();
                const ctx = this.audioContext;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            },

            // Game start sound
            gameStart() {
                this.resume();
                const ctx = this.audioContext;

                // Energetic ascending sequence
                const notes = [300, 400, 500, 700];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);

                    gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.08);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + i * 0.08 + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.12);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.08);
                    osc.stop(ctx.currentTime + i * 0.08 + 0.12);
                });
            }
        };


        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const bestElement = document.getElementById('best');
        const gameOverElement = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');
        const controlsElement = document.getElementById('controls');

        // Speeds are per second, so the game runs the same at 60 Hz and 120 Hz.
        const PLAYER_SPEED = 300;
        const BULLET_SPEED = 420;
        const ENEMY_SPEED_START = 120;
        const ENEMY_SPEED_STEP = 18;      // added every 100 points
        const STAR_SPEED = 60;            // × each star's own 0.2–0.7

        // Game state: 'ready' (title), 'playing', 'paused' or 'over'
        let mode = 'ready';
        let score = 0;
        let keys = {};
        let lastTime = 0;

        // Best score, kept if the browser allows storage
        const BEST_KEY = 'spaceShooter_best';
        let best = 0;
        try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch { /* storage blocked */ }
        bestElement.textContent = `Best: ${best}`;

        // Player
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            width: 50,
            height: 50,
            color: '#4aff4a'
        };

        // Bullets
        let bullets = [];
        const bulletWidth = 4;
        const bulletHeight = 15;
        let lastShot = 0;
        const shootCooldown = 250;

        // Enemies
        let enemies = [];
        const enemyWidth = 40;
        const enemyHeight = 40;
        let enemySpeed = ENEMY_SPEED_START;
        let lastEnemySpawn = 0;
        const enemySpawnRate = 1000;

        // Touch / mouse: drag anywhere on the canvas to steer. The ship moves by
        // as much as your finger does (relative, not "jump to the finger"), so
        // your thumb never hides it, and it fires for as long as you hold on.
        const pointer = { id: null, lastX: 0, firing: false };
        const isTouch = window.matchMedia('(pointer: coarse)').matches;
        if (isTouch) controlsElement.textContent = 'Drag anywhere on the game to steer · Hold to fire';

        // Input handling
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
            if (e.repeat) return;
            if (e.key === ' ' || e.key === 'Enter') {
                if (mode === 'ready' || mode === 'over') startGame();
                else if (mode === 'paused') setPaused(false);
            }
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                if (mode === 'playing') setPaused(true);
                else if (mode === 'paused') setPaused(false);
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('pointerdown', (e) => {
            if (mode === 'ready' || mode === 'over') { startGame(); }
            else if (mode === 'paused') { setPaused(false); }
            pointer.id = e.pointerId;
            pointer.lastX = e.clientX;
            pointer.firing = true;
            canvas.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        canvas.addEventListener('pointermove', (e) => {
            if (e.pointerId !== pointer.id || mode !== 'playing') return;
            // Screen pixels → game pixels
            const scale = canvas.width / canvas.getBoundingClientRect().width;
            player.x += (e.clientX - pointer.lastX) * scale;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            pointer.lastX = e.clientX;
        });

        const releasePointer = (e) => {
            if (e.pointerId !== pointer.id) return;
            pointer.id = null;
            pointer.firing = false;
        };
        canvas.addEventListener('pointerup', releasePointer);
        canvas.addEventListener('pointercancel', releasePointer);

        restartBtn.addEventListener('click', startGame);

        // Pause when the tab is hidden, so a run isn't lost while you're away
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && mode === 'playing') setPaused(true);
        });

        function setPaused(on) {
            mode = on ? 'paused' : 'playing';
            keys = {};
            pointer.firing = false;
            lastTime = 0;
        }

        // Shoot bullet
        function shoot() {
            const now = performance.now();
            if (now - lastShot > shootCooldown) {
                bullets.push({
                    x: player.x + player.width / 2 - bulletWidth / 2,
                    y: player.y,
                    width: bulletWidth,
                    height: bulletHeight
                });
                lastShot = now;

                // Play shoot sound
                SoundFX.shoot();
            }
        }

        // Spawn enemy
        function spawnEnemy() {
            const x = Math.random() * (canvas.width - enemyWidth);
            enemies.push({
                x: x,
                y: -enemyHeight,
                width: enemyWidth,
                height: enemyHeight
            });

            // Play subtle enemy spawn sound
            SoundFX.enemySpawn();
        }

        // Update player
        function updatePlayer(dt) {
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
                player.x = Math.max(0, player.x - PLAYER_SPEED * dt);
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width) {
                player.x = Math.min(canvas.width - player.width, player.x + PLAYER_SPEED * dt);
            }
            if (keys[' '] || pointer.firing) shoot();
        }

        // Update bullets
        function updateBullets(dt) {
            bullets = bullets.filter(bullet => {
                bullet.y -= BULLET_SPEED * dt;
                return bullet.y > -bulletHeight;
            });
        }

        // Update enemies
        function updateEnemies(dt, now) {
            if (now - lastEnemySpawn > enemySpawnRate) {
                spawnEnemy();
                lastEnemySpawn = now;
            }

            enemies.forEach(enemy => {
                enemy.y += enemySpeed * dt;
            });

            // Remove enemies that went off screen
            enemies = enemies.filter(enemy => enemy.y <= canvas.height);
        }

        // Check collisions
        function checkCollisions() {
            // Bullet-enemy collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (isColliding(bullets[i], enemies[j])) {
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);

                        // Play explosion sound
                        SoundFX.explosion();

                        score += 10;
                        scoreElement.textContent = `Score: ${score}`;

                        // Increase difficulty
                        if (score % 100 === 0) {
                            enemySpeed += ENEMY_SPEED_STEP;
                            // Play power-up sound for milestone
                            SoundFX.powerUp();
                        }
                        break;
                    }
                }
            }

            // Player-enemy collisions
            for (let enemy of enemies) {
                if (isColliding(player, enemy)) {
                    // Play player death sound
                    SoundFX.playerDeath();
                    endGame();
                    return;
                }
            }
        }

        // Collision detection helper
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Draw player
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#88ff88';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw bullets
        function drawBullets() {
            ctx.fillStyle = '#ffff44';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffff44';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
            ctx.shadowBlur = 0;
        }

        // Draw enemies
        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
                ctx.lineTo(enemy.x, enemy.y);
                ctx.lineTo(enemy.x + enemy.width, enemy.y);
                ctx.closePath();
                ctx.fill();

                // Enemy details
                ctx.fillStyle = '#cc0000';
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width / 2, enemy.y + enemy.height / 3, 6, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Stars background
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        function updateStars(dt) {
            stars.forEach(star => {
                star.y += star.speed * STAR_SPEED * dt;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // A dimmed panel of centred text over the playfield
        function drawMessage(title, lines) {
            ctx.fillStyle = 'rgba(0, 0, 20, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#4aff4a';
            ctx.font = 'bold 48px Arial, sans-serif';
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = '#ddd';
            ctx.font = '20px Arial, sans-serif';
            lines.forEach((line, i) => ctx.fillText(line, canvas.width / 2, canvas.height / 2 + 20 + i * 30));
            ctx.textAlign = 'start';
        }

        // End game
        function endGame() {
            mode = 'over';
            pointer.firing = false;
            if (score > best) {
                best = score;
                try { localStorage.setItem(BEST_KEY, String(best)); } catch { /* storage blocked */ }
                bestElement.textContent = `Best: ${best} (new!)`;
            }
            gameOverElement.style.display = 'block';
            restartBtn.style.display = 'block';
        }

        // Start or restart
        function startGame() {
            mode = 'playing';
            score = 0;
            enemySpeed = ENEMY_SPEED_START;
            scoreElement.textContent = `Score: ${score}`;
            bestElement.textContent = `Best: ${best}`;
            gameOverElement.style.display = 'none';
            restartBtn.style.display = 'none';
            player.x = canvas.width / 2 - 25;
            bullets = [];
            enemies = [];
            keys = {};
            lastEnemySpawn = performance.now();
            lastTime = 0;

            // Play game start sound
            SoundFX.gameStart();
        }

        // Main loop: always running, so the stars drift behind the title and pause screens
        function gameLoop(now) {
            // Seconds since the last frame, capped so a hitch can't teleport anything
            const dt = lastTime ? Math.min((now - lastTime) / 1000, 0.05) : 0;
            lastTime = now;

            if (mode === 'playing') {
                updatePlayer(dt);
                updateBullets(dt);
                updateEnemies(dt, now);
                checkCollisions();
            }
            if (mode !== 'paused') updateStars(dt);

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();
            if (mode !== 'ready') {
                drawPlayer();
                drawBullets();
                drawEnemies();
            }

            if (mode === 'ready') {
                drawMessage('SPACE SHOOTER', [isTouch ? 'Tap to start' : 'Press Space or click to start', `Best: ${best}`]);
            } else if (mode === 'paused') {
                drawMessage('PAUSED', [isTouch ? 'Tap to resume' : 'Press P, Space or click to resume']);
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
