# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='**/dev/***' \
            --exclude='**/test/***' \
            --exclude='**/tests/***' \
            --exclude='**/image_prompts/***' \
            --exclude='lib/phaser/phaser-4.0.0/src/***' \
            --exclude='lib/phaser/phaser-4.0.0/tests/***' \
            --exclude='lib/phaser/phaser-4.0.0/changelog/***' \
            --exclude='lib/phaser/phaser-4.0.0/docs/***' \
            --exclude='lib/phaser/phaser-4.0.0/skills/***' \
            --exclude='lib/phaser/phaser-4.0.0/scripts/***' \
            --exclude='lib/phaser/phaser-4.0.0/types/***' \
            ./ "$RUNNER_TEMP/pages/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # The action caps this at 10 minutes; larger values are silently reduced.
          timeout: 600000
