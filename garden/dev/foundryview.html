<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry viewer</title>
<!--
  The Robot Foundry on its own, without the garden around it: quick to load, for
  looking at it from anywhere. URL params: x, z, y (eye height), yaw, pitch,
  t (the Foundry's clock, seconds), fov. Drag to look, WASD to move.
  window.view(x, y, z, yaw, pitch, t) moves the camera from a script.
    python3 -m http.server 8077   # from the repo root, then open /garden/dev/foundryview.html
-->
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; } #info { position: fixed; left: 8px; bottom: 8px; color: #ffd98a; font: 12px monospace; }</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.165.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Foundry } from '../js/foundry.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(num('pr', 1));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
const camera = new THREE.PerspectiveCamera(num('fov', 62), innerWidth / innerHeight, 0.1, 3000);
const foundry = new Foundry({ renderer, quality: { tier: 'high' } });
foundry.inside = true;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(foundry.scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 1.15));
composer.addPass(new OutputPass());
composer.setSize(innerWidth, innerHeight);

const cam = { x: num('x', 8), y: num('y', 1.65), z: num('z', 0), yaw: num('yaw', Math.PI / 2), pitch: num('pitch', 0) };
foundry.clock = num('t', 0);
const keys = new Set();
addEventListener('keydown', (e) => keys.add(e.key.toLowerCase()));
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
let drag = null;
canvas.addEventListener('pointerdown', (e) => (drag = { x: e.clientX, y: e.clientY }));
addEventListener('pointerup', () => (drag = null));
addEventListener('pointermove', (e) => {
    if (!drag) return;
    cam.yaw -= (e.clientX - drag.x) * 0.004;
    cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch - (e.clientY - drag.y) * 0.004));
    drag = { x: e.clientX, y: e.clientY };
});
window.view = (x, y, z, yaw, pitch, t) => {
    Object.assign(cam, { x, y, z, yaw, pitch });
    if (t !== undefined) foundry.clock = t;
};
window.foundry = foundry;
window.frames = 0;
let last = performance.now();
const info = document.getElementById('info');
function frame(now) {
    const dt = q.has('still') ? 0 : Math.min(0.1, (now - last) / 1000);
    last = now;
    const v = keys.has('shift') ? 20 : 6;
    const f = (keys.has('w') ? 1 : 0) - (keys.has('s') ? 1 : 0), r = (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0);
    cam.x += (-Math.sin(cam.yaw) * f + Math.cos(cam.yaw) * r) * v * dt;
    cam.z += (-Math.cos(cam.yaw) * f - Math.sin(cam.yaw) * r) * v * dt;
    camera.position.set(cam.x, cam.y, cam.z);
    camera.rotation.set(cam.pitch, cam.yaw, 0, 'YXZ');
    foundry.update(dt, 0, camera, renderer.domElement.height);
    composer.render();
    window.frames++;
    info.textContent = `x ${cam.x.toFixed(1)} y ${cam.y.toFixed(1)} z ${cam.z.toFixed(1)} yaw ${cam.yaw.toFixed(2)} pitch ${cam.pitch.toFixed(2)} t ${foundry.clock.toFixed(1)} · calls ${renderer.info.render.calls}`;
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
