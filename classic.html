<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Wooldridge's Games &#8212; Classic List</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="classic-page">
    <div class="container">
        <header>
            <h1>&#127918; Andrew Wooldridge's Games</h1>
            <p class="subtitle">Browser games I've built &mdash; pick one and start playing!</p>
            <p class="bio-link"><a href="https://linktr.ee/triptych" target="_blank" rel="noopener">About me &amp; more links &rarr;</a></p>
            <p class="bio-link"><a href="index.html">&larr; Walk the 3D Garden of Games</a></p>
        </header>

        <section class="classic-controls" aria-label="Search and filter games">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">&#128269;</span>
                <input type="search" id="game-search" placeholder="Search games by title, description, or tag..." autocomplete="off">
            </div>
            <label class="category-filter" for="category-search">
                <span>Category</span>
                <input type="search" id="category-search" list="category-options" placeholder="All categories" autocomplete="off">
                <datalist id="category-options"></datalist>
            </label>
        </section>

        <div class="classic-tabs" role="tablist" aria-label="Game views">
            <button class="classic-tab active" id="carousel-tab" type="button" role="tab" aria-selected="true" aria-controls="carousel-panel">Featured carousel</button>
            <button class="classic-tab" id="game-list-tab" type="button" role="tab" aria-selected="false" aria-controls="game-list-panel" tabindex="-1">Game list</button>
        </div>

        <section class="classic-panel" id="carousel-panel" role="tabpanel" aria-labelledby="carousel-tab">
        <section class="carousel" aria-label="Featured games" tabindex="0">
            <div class="carousel-viewport">
                <div class="carousel-track">
                    <!-- Carousel slides are dynamically rendered from js/gamedata.js -->
                </div>
            </div>
            <button class="carousel-arrow carousel-arrow-prev" aria-label="Previous game">&#10094;</button>
            <button class="carousel-arrow carousel-arrow-next" aria-label="Next game">&#10095;</button>
            <div class="carousel-nav">
                <div class="carousel-dots"><!-- Dots are dynamically rendered --></div>
                <span class="carousel-counter" aria-live="polite"></span>
            </div>
        </section>
        </section>

        <section class="classic-panel" id="game-list-panel" role="tabpanel" aria-labelledby="game-list-tab" hidden>
            <p class="results-count" id="results-count"></p>
            <div class="games-grid"><!-- Game cards are dynamically rendered from js/gamedata.js --></div>
            <p class="no-results" id="no-results" hidden>No games match your search. Try a different keyword or category.</p>
        </section>
        <footer>
            <p>Web Games Collection &copy; 2026 <a href="https://linktr.ee/triptych" target="_blank" rel="noopener">Andrew Wooldridge</a></p>
            <p style="margin-top: 10px; font-size: 0.9em;">
                Total Games: <strong id="game-count">48</strong>
            </p>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
