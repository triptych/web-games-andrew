<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Dawnshard sprites</title>
<style>body{background:#6a7a8a;margin:0;padding:12px;font:12px monospace;color:#fff}canvas{image-rendering:pixelated;margin:2px;background:#8a9aaa}.row{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}</style></head>
<body><div id="out"></div>
<script type="module">
import { CHARS } from '../js/sim/data/classes.js';
import { ACTORS } from '../js/sim/data/story.js';
import { drawHero, BATTLE_POSES } from '../js/view/heroes.js';
const out = document.getElementById('out');
const q = new URLSearchParams(location.search);
const scale = +(q.get('s') || 3);
const only = q.get('c');
const add = (row, px) => { const c = px.toCanvas(); c.style.width = c.width * scale + 'px'; c.style.height = c.height * scale + 'px'; row.appendChild(c); };
for (const ch of Object.values(CHARS)) {
  if (only && !only.split(',').includes(ch.id)) continue;
  const h = document.createElement('div'); h.textContent = ch.name; out.appendChild(h);
  const row = document.createElement('div'); row.className = 'row'; out.appendChild(row);
  for (const v of ['down', 'up']) for (let f = 0; f < 3; f++) add(row, drawHero(ch.look, v, f));
  for (let f = 0; f < 3; f++) add(row, drawHero(ch.look, 'side', f));
  const row2 = document.createElement('div'); row2.className = 'row'; out.appendChild(row2);
  for (const p of BATTLE_POSES) add(row2, drawHero(ch.look, 'side', 1, p));
}
if (q.get('npc')) {
  // a sample of villagers: every hair style, both builds, caps and beards
  const { SKINS, HAIRS, STYLES } = await import('../js/sim/data/npcdata.js');
  const looks = [ACTORS.aldric.look, ACTORS.guard.look];
  const cl = [['#a8503a', '#e8d8a8'], ['#3a7a6a', '#f0e0c0'], ['#6a5a9a', '#e8e0f0'], ['#8a6a3a', '#f4ecd8'], ['#2a5a8a', '#d8e8f0'], ['#9a3a5a', '#f8e0e8']];
  for (let i = 0; i < 14; i++) looks.push({ skin: SKINS[i % SKINS.length], hair: i % 5 === 4 ? '#d8d8d8' : HAIRS[(i * 3) % HAIRS.length], style: STYLES[i % STYLES.length], cloth: cl[i % 6][0], cloth2: cl[i % 6][1], trim: ['#ffd35c', '#c8c8d0', '#e08040'][i % 3], build: i % 4 === 1 ? 'child' : i % 5 === 4 ? 'old' : 'norm', hat: i % 7 === 3 ? 'cap' : null, beard: i % 5 === 4 ? '#d8d8d8' : null });
  for (const v of ['down', 'side', 'up']) { const row = document.createElement('div'); row.className = 'row'; out.appendChild(row); for (const l of looks) add(row, drawHero(l, v, 1)); }
}
window.READY = true;
</script></body></html>
