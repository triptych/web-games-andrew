<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curio Cove — model gallery</title>
<style>
    html, body { margin: 0; background: #d8d4cc; font: 12px system-ui, sans-serif; color: #333; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 6px; padding: 8px; }
    .cell { background: #ece8e0; border-radius: 6px; text-align: center; }
    .cell canvas { width: 150px; height: 150px; display: block; }
    .wide { grid-column: span 3; }
    .wide canvas { width: 462px; height: 210px; }
    h2 { grid-column: 1 / -1; margin: 10px 0 0; font-size: 14px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.165.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { tileModel } from '../js/view/models.js';
import { buildArtifact } from '../js/view/artifacts.js';
import { buildSkeleton } from '../js/view/skeleton.js';
import { buildAnimal, animate } from '../js/view/animals.js';
import { ITEMS, DINOS } from '../js/sim/data.js';

const q = new URLSearchParams(location.search);
const only = q.get('only');           // tiles | art | dinos | animals
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(462, 210);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture;
const grid = document.getElementById('grid');

function shot(obj, label, { wide = false, dist = 1.6, y = 0, yaw = 0.5, pitch = 0.25 } = {}) {
    const w = wide ? 462 : 150, h = wide ? 210 : 150;
    renderer.setSize(w, h, false);
    const scene = new THREE.Scene();
    scene.environment = env;
    scene.background = new THREE.Color(0xece8e0);
    scene.environmentIntensity = 0.55;
    scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5a48, 0.7));
    const sun = new THREE.DirectionalLight(0xfff2dd, 1.7); sun.position.set(2, 4, 3); scene.add(sun);
    scene.add(obj);
    const cam = new THREE.PerspectiveCamera(32, w / h, 0.05, 100);
    cam.position.set(Math.sin(yaw) * dist * Math.cos(pitch), y + Math.sin(pitch) * dist, Math.cos(yaw) * dist * Math.cos(pitch));
    cam.lookAt(0, y, 0);
    renderer.render(scene, cam);
    const cell = document.createElement('div');
    cell.className = 'cell' + (wide ? ' wide' : '');
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(renderer.domElement, 0, 0);
    cell.append(c, label);
    grid.append(cell);
}
const head = (t) => { const h = document.createElement('h2'); h.textContent = t; grid.append(h); };

if (!only || only === 'tiles') {
    head('Tiles and specials');
    for (let c = 0; c < 6; c++) shot(tileModel({ k: 'gem', c }).group, `colour ${c}`, { yaw: 0, pitch: 0.4, dist: 1.5 });
    for (const s of ['h', 'v', 'bomb', 'scarab']) shot(tileModel({ k: 'gem', c: 3, s }).group, s, { yaw: 0, pitch: 0.4, dist: 1.6 });
    shot(tileModel({ k: 'sun', c: -1 }).group, 'sunstone', { yaw: 0, pitch: 0.4, dist: 1.6 });
    shot(tileModel({ k: 'gem', c: 1, crust: 1 }).group, 'crust', { yaw: 0, pitch: 0.4, dist: 1.6 });
    for (let i = 0; i < 5; i++) shot(tileModel({ k: 'relic', item: i }).group, `relic ${i}`, { yaw: 0, pitch: 0.4, dist: 1.6 });
}
if (!only || only === 'art') {
    head('Artifacts');
    for (const it of ITEMS.filter((i) => i.kind !== 'bone')) shot(buildArtifact(it, 1), `${it.name} (${it.kind})`, { dist: 2.1 });
}
if (!only || only === 'dinos') {
    head('Skeletons');
    for (const d of DINOS) {
        const s = buildSkeleton(d.id); s.setParts(['skull', 'neck', 'ribs', 'fore', 'hind', 'tail']);
        shot(s.group, d.name, { wide: true, dist: 9, y: 1.3, yaw: 1.2, pitch: 0.15 });
        const t = buildSkeleton(d.id); t.setParts(['skull', 'ribs']);
        shot(t.group, d.name + ' (skull, ribs)', { wide: true, dist: 9, y: 1.3, yaw: 1.2, pitch: 0.15 });
    }
}
if (!only || only === 'animals') {
    head('People');
    for (const k of ['player', 'otter', 'badger', 'owl', 'tortoise', 'fox', 'raccoon', 'hare', 'puffin', 'bunny', 'bear', 'cat', 'seal', 'sheep']) {
        const a = buildAnimal(k); animate(a, 1, {});
        shot(a.group, k, { dist: 3.4, y: 0.7, yaw: 0.35, pitch: 0.12 });
    }
}
window.__done = true;
</script>
</body>
</html>
