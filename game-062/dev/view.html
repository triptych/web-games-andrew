<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tee &amp; Sorcery — view test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.165.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/" } }
</script>
<script type="module">
// ?hole=1-2&cam=aim|fly|over|boss&t=seconds
import * as THREE from 'three';
import { Renderer } from '../js/view/renderer.js';
import { Sky } from '../js/view/sky.js';
import { Fx } from '../js/view/fx.js';
import { CameraDirector } from '../js/view/camera.js';
import { HoleView } from '../js/view/holeview.js';
import { TOON } from '../js/view/toon.js';
import { HOLE_BY_ID } from '../js/sim/holes.js';
import { buildCourse } from '../js/sim/course.js';
import { World } from '../js/sim/world.js';
import { tierProfile } from '../js/sim/rpg.js';
const q = new URLSearchParams(location.search);
const id = q.get('hole') ?? '1-1';
const R = new Renderer(document.getElementById('c'));
R.setQuality(+(q.get('q') ?? 1));
const sky = new Sky(R.scene), fx = new Fx(R.scene), dir = new CameraDirector(R.camera);
const hv = new HoleView(R, fx, sky, dir);
const course = buildCourse(HOLE_BY_ID[id]);
const prof = tierProfile(course.hole.realm);
const world = new World(course, { profile: prof });
hv.build(course, world, prof);
for (let i = 0; i < 5; i++) world.step(1 / 60);
const cam = q.get('cam') ?? 'aim';
const B = world.s.ball;
if (q.get('ball')) { const [x, z] = q.get('ball').split(',').map(Number); B.x = x; B.z = z; B.y = course.heightAt(x, z) + 0.2; world.s.aimYaw = world.defaultAim(); hv.placeHeroAtBall(true); }
if (cam === 'aim') dir.setAim(B, world.s.aimYaw, world.s.club, world.distToCup());
else if (cam === 'over') dir.setOverhead(course, B, world.target());
else if (cam === 'boss') { const T = world.target(); dir.setFocus(new THREE.Vector3(T.x, T.y, T.z), new THREE.Vector3(T.x + 8, T.y + 5, T.z - 16)); }
else if (cam === 'hero') { const h = hv.hero.root.position; const yaw = hv.heroYaw; dir.setFocus(new THREE.Vector3(h.x, h.y + 1.3, h.z), new THREE.Vector3(h.x + Math.sin(yaw) * 5, h.y + 2, h.z + Math.cos(yaw) * 5)); }
else if (cam === 'cup') { const C = course.cup; dir.setFocus(new THREE.Vector3(C.x, C.y + 1, C.z), new THREE.Vector3(C.x + 6, C.y + 4, C.z - 10)); }
dir.update(1 / 60); dir.snap();
let t = 0;
const T = +(q.get('t') ?? 1);
window.__ready = false;
function frame(dt) { t += dt; TOON.uTime.value = t; world.step(dt); hv.sync(dt, t, { }); dir.update(dt); sky.update(dt, t, R.camera.position); fx.update(dt, R.camera.position, hv.ball.position); R.render(dt, t); }
for (let i = 0; i < Math.round(T * 30); i++) frame(1 / 30);
window.__ready = true;
</script>
</body>
</html>
