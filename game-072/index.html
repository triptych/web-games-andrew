<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frosty Fling</title>
<script src="../lib/page-audio.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: full-bleed WebGL stage; HUD floats in the safe-area corners; menus are frosted cards with procedurally drawn snow caps */
:root{
  --night:#191640; --dusk:#2a2768; --frost:#f2f8ff; --ice:#a9dcff; --ice-deep:#2f5fb8;
  --berry:#e8364f; --berry-deep:#9e1734; --pine:#27a074; --pine-deep:#13684a; --gold:#ffc94a; --gold-deep:#b97a12;
  --glass:rgba(24,22,64,.62); --glass-line:rgba(205,230,255,.28);
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--frost);font-family:var(--font-body)}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#back-link{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 58px);z-index:20;padding:7px 12px;border:1.5px solid var(--glass-line);border-radius:999px;background:var(--glass);color:var(--frost);font-weight:900;font-size:13px;text-decoration:none;pointer-events:auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#back-link:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 42%,transparent 58%,rgba(12,8,44,.55))}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .4s ease-out}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ol{--pc:var(--ice-deep);text-shadow:0 3px 0 var(--pc),3px 0 0 var(--pc),-3px 0 0 var(--pc),0 -3px 0 var(--pc),2px 2px 0 var(--pc),-2px 2px 0 var(--pc),2px -2px 0 var(--pc),-2px -2px 0 var(--pc),0 7px 0 rgba(10,6,40,.35)}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:clamp(20px,5.2vw,34px);color:#fff;white-space:nowrap;animation:pop 1.15s cubic-bezier(.2,1.4,.4,1) forwards}
.pop.big{font-size:clamp(34px,10vw,72px)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4) rotate(var(--rot,0deg))}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(var(--rot,0deg))}70%{opacity:1;transform:translate(-50%,-115%) scale(1) rotate(var(--rot,0deg))}100%{opacity:0;transform:translate(-50%,-165%) scale(.9) rotate(var(--rot,0deg))}}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none}
.hud-left{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.hud-right{display:flex;gap:8px;justify-content:flex-end;align-items:center;min-width:0}
.hud-center{display:flex;flex-direction:column;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1.5px solid var(--glass-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--font-display);font-size:15px;letter-spacing:.02em;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip small{font-family:var(--font-body);font-weight:900;opacity:.72;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.chip svg{flex:none}
.iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:1.5px solid var(--glass-line);background:var(--glass);color:var(--frost);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0}
.iconbtn:active{transform:scale(.94)}
#dist{font-family:var(--font-display);font-size:clamp(34px,9vw,58px);line-height:1;font-variant-numeric:tabular-nums;color:#fff}
#dist .u{font-size:.45em;margin-left:3px}
.track{position:relative;width:min(560px,92vw);height:12px;border-radius:999px;background:rgba(255,255,255,.14);border:1.5px solid var(--glass-line);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#7cc6ff,#ffffff)}
.track .ball{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfe6ff 60%,#8fb6e8);box-shadow:0 2px 6px rgba(0,0,0,.35);left:0}
.track .goal,.track .best{position:absolute;top:-18px;transform:translateX(-50%);font-family:var(--font-display);font-size:11px;letter-spacing:.06em}
.track .goal{color:var(--gold)}
.track .best{color:var(--ice);top:16px}
.track .goal::after{content:'';position:absolute;left:50%;top:16px;width:2px;height:16px;background:var(--gold);transform:translateX(-50%)}
#progressRow{grid-column:1/-1;display:flex;justify-content:center;padding-top:6px}

#slams{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#slams .pips{display:flex;gap:6px}
#slams .pip{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1.5px solid var(--glass-line);transition:opacity .2s,transform .2s}
#slams .pip.used{opacity:.3;transform:scale(.85)}
#slams .lbl{font-family:var(--font-display);font-size:15px;letter-spacing:.08em;color:#fff}
.ol.sm{text-shadow:0 2px 0 var(--pc),2px 0 0 var(--pc),-2px 0 0 var(--pc),0 -2px 0 var(--pc),0 4px 0 rgba(10,6,40,.3)}

#meter{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);width:38px;height:min(50vh,340px);border-radius:20px;padding:5px;background:var(--glass);border:2px solid var(--glass-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
#meter .bar{position:relative;width:100%;height:100%;border-radius:14px;background:linear-gradient(0deg,#4d7cf0 0%,#8fd3ff 40%,#ffd36b 75%,#ff7a59 89%,#ffef9a 90%,#fff 100%);overflow:visible}
#meter .zone{position:absolute;left:-4px;right:-4px;top:-2px;height:11%;border:2px dashed #fff;border-radius:10px;animation:zone 1s ease-in-out infinite}
#meter .needle{position:absolute;left:50%;width:30px;height:30px;margin:0 0 -15px -15px;bottom:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8ecff 55%,#93b9ec);box-shadow:0 3px 8px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.4)}
#meter .lab{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);font-family:var(--font-display);font-size:12px;letter-spacing:.1em}
@keyframes zone{50%{opacity:.45}}
#tapPrompt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);font-family:var(--font-display);font-size:clamp(22px,6vw,34px);color:#fff;pointer-events:none;white-space:nowrap;animation:breathe 1.1s ease-in-out infinite}
#tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);transform:translateX(-50%);width:min(420px,calc(100vw - 32px));text-align:center;font-weight:800;font-size:15px;line-height:1.35;padding:10px 14px;border-radius:16px;background:var(--glass);border:1.5px solid var(--glass-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.08)}}

#bonusHud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.timer{position:relative;width:64px;height:64px}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.size{display:flex;flex-direction:column;align-items:center}
.size b{font-family:var(--font-display);font-size:clamp(34px,9vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.size small{font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-top:4px}
#ticker{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none}
#ticker div{font-weight:900;font-size:14px;padding:4px 10px;border-radius:10px;background:var(--glass);animation:tick 2.2s forwards}
@keyframes tick{0%{opacity:0;transform:translateX(-10px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);padding:10px 18px;border-radius:16px;background:linear-gradient(180deg,var(--gold),#ffab2e);color:#3a1d00;font-family:var(--font-display);font-size:clamp(16px,4.4vw,22px);box-shadow:0 6px 0 var(--gold-deep),0 12px 24px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;animation:bannerIn 2.6s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1.05)}18%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}

/* Screens */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 26px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto;touch-action:pan-y;animation:fadeIn .35s ease}
.screen.dim{background:radial-gradient(circle at 50% 40%,rgba(36,30,100,.5),rgba(10,8,36,.84))}
.screen.bottom{align-items:end}
@keyframes fadeIn{from{opacity:0}}
.panel{position:relative;width:min(460px,100%);background:linear-gradient(180deg,rgba(56,50,138,.9),rgba(28,24,80,.94));border:2px solid var(--glass-line);border-radius:26px;padding:36px 22px 22px;box-shadow:0 24px 60px rgba(4,2,30,.55),inset 0 1px 0 rgba(255,255,255,.18);text-align:center;animation:panelIn .5s cubic-bezier(.2,1.3,.4,1)}
.panel.wide{width:min(640px,100%)}
.panel::before{content:'';position:absolute;left:-7px;right:-7px;top:-18px;height:44px;background:var(--cap) no-repeat center/100% 100%;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,40,.28))}
@keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.94)}}
.eyebrow{font-weight:900;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:6px 0 4px;text-wrap:balance}
.panel p{margin:6px auto;max-width:36ch;line-height:1.45;font-weight:600;opacity:.9}
.bigstat{font-family:var(--font-display);font-size:clamp(46px,13vw,72px);line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.bigstat .u{font-size:.4em;margin-left:4px}
.stats{display:grid;grid-template-columns:1fr auto;gap:8px 16px;text-align:left;margin:14px 0 4px;padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.18)}
.stats dt{font-weight:800;opacity:.8}
.stats dd{margin:0;font-family:var(--font-display);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.btn{pointer-events:auto;font-family:var(--font-display);font-size:21px;letter-spacing:.02em;color:#fff;border:0;border-radius:18px;padding:14px 26px;cursor:pointer;background:repeating-linear-gradient(-45deg,var(--berry) 0 14px,#f04a62 14px 28px);background-size:200% 100%;box-shadow:0 6px 0 var(--berry-deep),0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .08s;animation:candy 3s linear infinite;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--berry-deep),0 6px 12px rgba(0,0,0,.3)}
.btn.ice{background:linear-gradient(180deg,#bfe6ff,#7fbff2);color:#123a7a;text-shadow:none;box-shadow:0 6px 0 #3f78c4,0 12px 24px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.6);animation:none}
.btn.ice:active{box-shadow:0 2px 0 #3f78c4}
.btn.gold{background:linear-gradient(180deg,#ffe07a,var(--gold));color:#4a2500;text-shadow:none;box-shadow:0 6px 0 var(--gold-deep),0 12px 24px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.6);animation:none}
.btn.small{font-size:16px;padding:9px 14px;border-radius:13px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;animation:none}
@keyframes candy{to{background-position:-56px 0}}
.btn:focus-visible,.iconbtn:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.link{background:none;border:0;color:var(--ice);font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.75;margin-top:12px;font-family:var(--font-body)}

/* Title */
.title{display:flex;flex-direction:column;justify-content:space-between;align-items:center;height:100%;width:100%;max-width:720px;gap:16px}
.logo{position:relative;margin:2vh 0 0;font-family:var(--font-display);font-weight:400;line-height:.86;text-align:center;filter:drop-shadow(0 5px 0 #23308a) drop-shadow(0 16px 22px rgba(0,0,0,.45))}
.logo .w{display:block;font-size:clamp(64px,19vw,140px);letter-spacing:.01em}
.logo .w span{display:inline-block;animation:bob 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.22s)}
.logo .w1 span{background:linear-gradient(180deg,#fff 30%,#bfe2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .w2 span{background:repeating-linear-gradient(-50deg,#ff4b64 0 12px,#ffffff 12px 22px);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .icicles{position:absolute;left:4%;right:4%;top:calc(clamp(64px,19vw,140px) * .78);height:28px;pointer-events:none}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.tagline{font-weight:800;font-size:clamp(15px,3.8vw,18px);max-width:30ch;text-align:center;margin:10px auto 0;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.title-foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:4px}
.title-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Shop */
.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:600px){.shop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.upg{background:rgba(255,255,255,.07);border:1.5px solid var(--glass-line);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.upg h3{font-family:var(--font-display);font-weight:400;font-size:18px;margin:0}
.upg p{font-size:12.5px;margin:0;line-height:1.3;opacity:.82;min-height:2.6em}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.pip{width:8px;height:8px;border-radius:3px;background:rgba(255,255,255,.18)}
.pip.on{background:var(--gold);box-shadow:0 0 6px rgba(255,201,74,.6)}
.wallet{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:22px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.22);margin-top:4px;font-variant-numeric:tabular-nums}

.formcard{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);margin-top:12px}
.formcard b{font-family:var(--font-display);font-weight:400;font-size:20px;display:block}
.formcard span{font-size:13.5px;opacity:.85}
.meterbar{height:14px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0 2px;position:relative}
.meterbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7cc6ff,#fff);border-radius:999px}
.meterbar em{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}
kbd{font-family:var(--font-body);font-weight:900;font-size:12px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.14)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);font-family:var(--font-display);font-size:28px;transition:opacity .5s}
#loading.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.logo .w span,.btn,#meter .zone,#tapPrompt{animation:none}.pop{animation-duration:.7s}}
</style>

<canvas id="stage" aria-label="Frosty Fling game view"></canvas>

  </div>
  <div id="progressRow"><div class="track" id="track"><div class="fill" id="trackFill"></div><div class="goal" id="trackGoal">GOAL</div><div class="best" id="trackBest">BEST</div><div class="ball" id="trackBall"></div></div></div>
</div>

  <div class="timer"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="rgba(24,22,64,.62)" stroke="rgba(255,255,255,.18)" stroke-width="6"/><circle id="timerArc" cx="32" cy="32" r="27" fill="none" stroke="#ffc94a" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg><b id="timerNum">40</b></div>
  <div class="size"><b id="sizeNum" class="ol">1.20 m</b><small>snowball width</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ================= utilities =================
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = Math.random;
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');

// ================= save =================
const SAVE_KEY = 'frosty-fling-v1';
const defaultSave = () => ({ level: 1, flakes: 0, best: 0, upg: { power: 0, bounce: 0, aero: 0, slam: 0, magnet: 0, luck: 0 }, muted: false, pendingBonus: 0, runs: 0, seenSlam: false, bestBall: 0 });
let save = defaultSave();
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));

const Sfx = (() => {
  let ctx = null, master, sfx, music, noiseBuf, timer = null, nextT = 0, step = 0, tempo = 138, musicOn = true;
  const MEL = [72,0,74,76,79,0,76,74, 72,0,69,0,72,74,76,0, 77,0,76,74,72,0,74,0, 76,74,72,69,67,0,0,0,
               72,0,74,76,79,0,81,79, 77,0,76,74,72,74,76,0, 79,77,76,74,72,0,69,71, 72,0,0,0,79,0,84,0];
  const ROOTS = [60, 60, 65, 60, 65, 60, 67, 60];
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { ctx = new AC(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = save.muted ? 0 : 0.85; master.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.gain.value = 0.7; sfx.connect(master);
    music = ctx.createGain(); music.gain.value = 0.2; music.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ctx.currentTime + 0.1; timer = setInterval(schedule, 40);
  }
  function tone(f, dur, type = 'sine', vol = 0.3, slide = null, when = 0, dest) {
    if (!ctx) return; const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  function noiseAt(t, dur, vol, freq, q, type, slide, dest) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
    if (slide) f.frequency.exponentialRampToValueAtTime(slide, t + dur); f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  function noise(dur, vol = 0.3, freq = 1000, q = 1, type = 'bandpass', when = 0, slide = null) { if (!ctx) return; noiseAt(ctx.currentTime + when, dur, vol, freq, q, type, slide); }
  function bell(f, t, vol) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 2.01;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); o2.connect(g); g.connect(music); o.start(t); o2.start(t); o.stop(t + 0.5); o2.stop(t + 0.5);
  }
  function bass(f, t, dur) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(music); o.start(t); o.stop(t + dur + 0.05);
  }
  function schedule() {
    if (!ctx || !musicOn) { if (ctx) nextT = ctx.currentTime + 0.05; return; }
    const spb = 60 / tempo / 2;
    while (nextT < ctx.currentTime + 0.25) {
      const s = step % 64, n = MEL[s];
      if (n) bell(midi(n), nextT, 0.11);
      if (s % 8 === 0 || s % 8 === 4) bass(midi(ROOTS[Math.floor(s / 8)] - 24 + (s % 8 === 4 ? 7 : 0)), nextT, spb * 1.8);
      if (s % 8 === 2 || s % 8 === 6) { const r = ROOTS[Math.floor(s / 8)]; [0, 4, 7].forEach(k => bell(midi(r + k), nextT, 0.025)); }
      noiseAt(nextT, 0.05, s % 2 ? 0.025 : 0.05, 7500, 0.8, 'highpass', null, music);
      nextT += spb; step++;

  }

    init, get ready() { return !!ctx; },
    setMuted(m) { if (master) master.gain.setTargetAtTime(m ? 0 : 0.85, ctx.currentTime, 0.05); },
    setTempo(t) { tempo = t; }, setMusic(on) { musicOn = on; },
    boing(p = 1, v = 0.3) { tone(200 * p, 0.28, 'sine', v, 560 * p); tone(300 * p, 0.2, 'triangle', v * 0.35, 760 * p); },
    thump(v = 0.4) { noise(0.18, v, 380, 0.7, 'lowpass'); tone(120, 0.16, 'sine', v * 0.7, 55); },
    crunch() { noise(0.14, 0.35, 1900, 0.6); noise(0.08, 0.25, 900, 0.9, 'bandpass', 0.05); },
    jingle() { for (let i = 0; i < 5; i++) tone(1500 + i * 230 + Math.random() * 60, 0.3, 'triangle', 0.06, null, i * 0.035); noise(0.35, 0.12, 8000, 1, 'highpass'); },
    pling(n = 0) { const f = 880 * Math.pow(2, (n % 14) / 12); tone(f, 0.14, 'sine', 0.13); tone(f * 2, 0.1, 'sine', 0.04); },
    launch() { noise(0.5, 0.35, 400, 1, 'bandpass', 0, 3200); tone(160, 0.32, 'sawtooth', 0.05, 80); tone(520, 0.22, 'triangle', 0.1, 900, 0.02); },
    whoosh() { noise(0.45, 0.22, 500, 0.7, 'bandpass', 0, 2600); },
    slam() { tone(700, 0.22, 'square', 0.05, 140); noise(0.25, 0.25, 1200, 0.5, 'lowpass', 0, 200); },
    slamHit() { tone(90, 0.35, 'sine', 0.5, 40); noise(0.4, 0.45, 600, 0.5, 'lowpass'); tone(300, 0.4, 'triangle', 0.15, 900, 0.06); },
    melt() { tone(520, 0.45, 'sine', 0.15, 160); noise(0.5, 0.12, 5000, 0.5, 'highpass'); },
    pop() { tone(900, 0.08, 'square', 0.08, 300); noise(0.08, 0.3, 2500, 1); },
    ding() { [0, 0.08, 0.16].forEach((w, i) => tone(1318 * (1 + i * 0.25), 0.6, 'triangle', 0.12, null, w)); },
    bonk() { tone(170, 0.2, 'square', 0.1, 70); noise(0.1, 0.25, 600, 1); },
    gulp(s = 1) { const f = clamp(700 / Math.sqrt(s + 0.2), 140, 1200); tone(f, 0.12, 'sine', 0.16, f * 1.8); noise(0.06, 0.12, 2000, 1); },
    click() { tone(1000, 0.05, 'triangle', 0.08); },
    buy() { [0, 0.06, 0.12].forEach((w, i) => tone(660 * Math.pow(1.26, i), 0.18, 'triangle', 0.12, null, w)); },
    fanfare() { [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => tone(midi(n + 12), 0.35, 'triangle', 0.1, null, i * 0.07)); noise(0.8, 0.1, 9000, 1, 'highpass', 0.3); },
    firework() { noise(0.6, 0.3, 300, 0.5, 'lowpass'); for (let i = 0; i < 6; i++) noise(0.05, 0.1, 6000, 1, 'highpass', 0.15 + i * 0.06); },
    sad() { tone(392, 0.25, 'triangle', 0.1); tone(330, 0.4, 'triangle', 0.1, null, 0.22); },
  };
})();

// ================= GLSL =================
const GLSL_NOISE = `
float h3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float n21(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ v+=a*n21(p); p*=2.03; a*=.5; } return v; }
`;

// Snow shader: lumpy displacement, wrap lighting with cool subsurface, fresnel rim, view-dependent glitter
const SNOW_VS = `
uniform float uLump;
varying vec3 vN; varying vec3 vW; varying vec3 vL;
#include <fog_pars_vertex>
${GLSL_NOISE}
void main(){
  vec3 p=position; float n=n3(p*3.5)*0.6+n3(p*9.0)*0.4; p+=normal*(n-0.5)*uLump;
  vL=p;
  vec4 w=modelMatrix*vec4(p,1.0); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal);
  vec4 mvPosition=viewMatrix*w; gl_Position=projectionMatrix*mvPosition;
  #include <fog_vertex>
}`;
const SNOW_FS = `
uniform vec3 uSun,uSunCol,uSky,uGround,uRim,uBase; uniform float uTime;
varying vec3 vN; varying vec3 vW; varying vec3 vL;
#include <fog_pars_fragment>
${GLSL_NOISE}
void main(){
  vec3 N=normalize(vN);
  N=normalize(N+(vec3(n3(vL*14.0),n3(vL*30.0+7.0),n3(vL*22.0+3.0))-0.5)*0.28);
  vec3 V=normalize(cameraPosition-vW);
  vec3 L=normalize(uSun);
  float ndl=dot(N,L);
  float wrap=pow(clamp(ndl*0.5+0.5,0.,1.),1.4);
  vec3 hemi=mix(uGround,uSky,N.y*0.5+0.5);
  vec3 col=uBase*(hemi*0.58+uSunCol*wrap*0.62);
  col+=vec3(0.16,0.32,0.62)*(1.0-wrap)*0.28;
  float fres=pow(1.0-clamp(dot(N,V),0.,1.),3.0);
  col+=uRim*fres*0.6;
  vec3 H=normalize(L+V);
  col+=uSunCol*pow(clamp(dot(N,H),0.,1.),28.0)*0.18;
  float s=h3(floor(vL*55.0)+floor(dot(V,vec3(7.,11.,13.))*2.5));
  float glint=step(0.982,s)*pow(clamp(dot(N,H)*0.5+0.5,0.,1.),4.0)*(0.6+0.4*sin(uTime*7.0+s*60.0));
  col+=vec3(1.0,0.97,0.9)*glint*1.8;
  gl_FragColor=vec4(col,1.0);
  #include <fog_fragment>
}`;
function makeSnowMat(base = 0xf6f9ff, lump = 0.05) {
  return new THREE.ShaderMaterial({
    uniforms: Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog), {
      uTime: U.uTime, uSun: U.uSun, uSunCol: U.uSunCol, uSky: U.uSky, uGround: U.uGround, uRim: U.uRim,
      uBase: { value: new THREE.Color(base) }, uLump: { value: lump },
    }),
    vertexShader: SNOW_VS, fragmentShader: SNOW_FS, fog: true,
  });
}

    for (let i = -n - 1; i <= n + 1; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s + s / 2, 0); g.lineTo(i * s + s / 2 + w, h); g.lineTo(i * s + w, h); g.closePath(); g.fill(); }

  const [bg, fg, p] = WRAPS[i % 5];

    g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.strokeStyle = fg; g.lineWidth = 5; g.lineCap = 'round';
    if (p === 'dots') { for (let y = 0; y < 4; y++) for (let x = 0; x < 5; x++) { g.beginPath(); g.arc(x * 32 + (y % 2) * 16, 16 + y * 32, 7, 0, TAU); g.fill(); } }

}

}

  mute(b) { save.muted = !save.muted; persist(); Sfx.setMuted(save.muted); if (b.classList.contains('iconbtn')) b.innerHTML = soundIcon(); else b.textContent = save.muted ? 'Sound off' : 'Sound on'; },
  reset() {
    showScreen(`<div class="panel"><div class="eyebrow">Careful</div><h2>Start over?</h2><p>This melts your snowman back to a snowball and clears every level, upgrade and snowflake.</p>
      <div class="btn-row"><button class="btn ice" data-act="title" data-focus>Keep my snowman</button><button class="btn" data-act="resetYes">Reset everything</button></div></div>`);
  },
  resetYes() { const m = save.muted; save = defaultSave(); save.muted = m; persist(); gotoTitle(); },
};
screensEl.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; Sfx.init(); Sfx.click(); ACT[b.dataset.act] && ACT[b.dataset.act](b); });
$('#pauseBtn').addEventListener('click', e => { e.stopPropagation(); Sfx.init(); showPause(); });
$('#pauseBtn2').addEventListener('click', e => { e.stopPropagation(); Sfx.init(); showPause(); });

// ================= input =================
let dragging = false, keyL = false, keyR = false;
function onAction() { if (paused) return; if (mode === 'aim') launch(); else if (mode === 'flight') trySlam(); }
function steerFrom(x) { B.steer = clamp((x / innerWidth - 0.5) * 2.6, -1, 1); }
window.addEventListener('pointerdown', e => {
  Sfx.init();
  if (e.target.closest('button,.screen')) return;
  if (mode === 'bonus') { dragging = true; steerFrom(e.clientX); return; }
  onAction();
});
window.addEventListener('pointermove', e => { if (mode === 'bonus' && dragging) steerFrom(e.clientX); });
const endDrag = () => { dragging = false; if (!keyL && !keyR) B.steer = 0; };
window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keyL = true; B.steer = (keyR ? 1 : 0) - 1; e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keyR = true; B.steer = 1 - (keyL ? 1 : 0); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'Enter') { if (!screensEl.firstElementChild) { e.preventDefault(); Sfx.init(); if (!e.repeat) onAction(); } }
  else if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (paused) resume(); else showPause(); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyL = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyR = false;
  if (!dragging) B.steer = (keyR ? 1 : 0) - (keyL ? 1 : 0);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) showPause(); });
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); });
window.addEventListener('contextmenu', e => e.preventDefault());

// ================= main loop =================
let mode = 'loading', paused = false, T = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (paused) dt = 0;
  T += dt; U.uTime.value = T;
  if (mode.startsWith('bonus')) updateBonus(dt);
  else { updateFling(dt); if (mode === 'title') titleCam(T); else if (mode === 'evolve') evolveCam(T); }
  confetti.update(dt); puffs.update(dt); sparks.update(dt);
  applyCam(dt); placeBackdrop();
  renderer.render(scene, camera);
}
function boot() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  gotoTitle(); titleCam(0); applyCam(0); placeBackdrop();
  requestAnimationFrame(frame);
  setTimeout(() => $('#loading').classList.add('gone'), 250);
}
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(boot);
</script>
