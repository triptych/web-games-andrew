<body data-layout="cabinet">
    <a id="back-link" href="../index.html">← Games</a>

    <canvas id="arcade" aria-hidden="true"></canvas>

    <main id="cab">
        <header id="marquee">
            <div class="mq-light"></div>
            <div class="mq-logo"><span>CHROME</span> <span>CHALICE</span></div>
            <div class="mq-sub">Quest of the Neon Square</div>
        </header>

        <section id="bezel">
            <div class="bz-art bz-l"><span>1 PLAYER</span><span>6 REALMS</span></div>
            <div id="tube">
                <canvas id="screen" aria-label="CHROME CHALICE game screen"></canvas>
                <canvas id="crt" aria-hidden="true"></canvas>
                <div id="glass"></div>
                <div id="tap" aria-hidden="true"></div>
            </div>
            <div class="bz-art bz-r"><span>INSERT COIN</span><span>© 1988</span></div>
        </section>

        <section id="panel">
            <div id="stick" aria-label="Joystick" role="slider" aria-valuetext="centre">
                <div class="st-base"></div>
                <div class="st-top"><div class="st-shaft"></div><div class="st-ball"></div></div>
            </div>
            <div id="btns">
                <button id="b-a" class="abtn red" aria-label="Z: use"><span>Z</span><small>USE</small></button>
                <button id="b-b" class="abtn yellow" aria-label="X: drop"><span>X</span><small>DROP</small></button>
                <button id="b-c" class="abtn cyan" aria-label="C: dash"><span>C</span><small>DASH</small></button>
            </div>
            <div id="sysbtns">
                <button id="b-start" class="sbtn" aria-label="1 player start">1P<br>START</button>
                <button id="b-pause" class="sbtn" aria-label="Pause">❚❚</button>
            </div>
            <div class="panel-art">Z&nbsp;USE · X&nbsp;DROP · C&nbsp;DASH</div>
        </section>

        <section id="coindoor">
            <button class="slot" id="coin1" aria-label="Insert coin"><i></i><span>25¢</span></button>
            <div class="door-label">INSERT COIN</div>
            <button class="slot" id="coin2" aria-label="Insert coin"><i></i><span>25¢</span></button>
        </section>
    </main>

    <div id="keys-hint">ARROWS move · Z use · X drop · C dash · ENTER start · 5 coin · P pause · V view</div>
    <div id="boot">POWERING UP…</div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
