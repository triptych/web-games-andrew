<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doom &amp; Doilies — sprite gallery</title>
    <style>
        body { margin: 0; padding: 16px; background: #6d6a78; color: #fff; font: 12px system-ui, sans-serif; }
        h2 { margin: 18px 0 6px; font-size: 14px; }
        .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
        figure { margin: 0; text-align: center; }
        canvas { image-rendering: pixelated; display: block; margin: 0 auto 4px; }
    </style>
</head>
<body>
    <div id="out"></div>
    <script type="module">
        // A neutral page for judging every sprite at 4× before it goes under coloured lights and bloom.
        import { drawOverlord, drawMinion, drawVisitor, drawStation, drawHenchman, drawEmblem, drawToken, drawPumpkin, TOKEN_KINDS } from '../js/view/art.js';
        import { MINIONS, VISITORS, HOBBIES } from '../js/sim/data.js';
        const out = document.getElementById('out');
        const section = (title, items) => {
            const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
            const row = document.createElement('div'); row.className = 'row'; out.appendChild(row);
            for (const [label, px] of items) {
                const f = document.createElement('figure');
                const c = px.toCanvas();
                c.style.width = c.width * 4 + 'px'; c.style.height = c.height * 4 + 'px';
                f.appendChild(c);
                const cap = document.createElement('figcaption'); cap.textContent = label; f.appendChild(cap);
                row.appendChild(f);
            }
        };
        section('The Overlord', ['idle', 'craft', 'cackle'].flatMap((pose) => HOBBIES.map((h) => [`${pose} · ${h.id}`, drawOverlord(pose, h.id)])));
        section('Minions', MINIONS.map((m) => [m.name, drawMinion(m.id)]));
        section('Visitors and henchmen', [...VISITORS.map((v) => [v.name, drawVisitor(v.id)]), ['Henchman', drawHenchman()], ['Emblem', drawEmblem()]]);
        section('Centrepieces', HOBBIES.flatMap((h) => [0, 1, 2, 3].map((t) => [`${h.id} ${t}`, drawStation(h.id, t)])));
        section('Skull Swap tokens', [...TOKEN_KINDS.map((k) => [k, drawToken(k)]), ['jack-o’-lantern', drawPumpkin()]]);
        window.ready = true;
    </script>
</body>
</html>
