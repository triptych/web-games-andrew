<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hearthbound</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #161320;
            --panel: #211d2e;
            --panel-light: #2b2440;
            --text: #f0e9da;
            --accent: #e0a458;
            --danger: #d1495b;
            --success: #7fb069;
            --gold: #ffd166;
            --border: #4a4160;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Georgia', 'Palatino Linotype', serif;
            overflow: hidden;
            /* Mobile pass (Phase 5): prevent the double-tap-to-zoom and
               pull-to-refresh/overscroll gestures mobile browsers apply by
               default, which otherwise fight tapping through dialogue and
               battle menus quickly. */
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }

        .hidden { display: none !important; }

        /* Mobile pass (Phase 5): every button gets a comfortable minimum
           touch target (~44x44px per WCAG/Apple/Material guidance) via
           padding rather than shrinking any visible glyph/label. */
        button {
            font-family: inherit;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--panel-light);
            color: var(--text);
            border-radius: 6px;
            padding: 8px 14px;
            min-height: 44px;
            min-width: 44px;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        button:hover:not(:disabled) { background: var(--accent); color: #1a1626; }
        button:active:not(:disabled) { transform: scale(0.97); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Accessibility pass (Phase 4): a clear, consistent focus ring for
           keyboard navigation, on buttons and the click-to-advance textbox. */
        button:focus-visible,
        #vn-text:focus-visible,
        input[type="range"]:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        /* ============================================================
           Title screen
        ============================================================ */
        #title-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 30%, #2b2440, #100d18 80%);
            text-align: center;
            padding: 24px;
        }
        #title-screen h1 {
            /* Fluid instead of a fixed 56px (Phase 5): scales down smoothly
               on narrow phones so "Hearthbound" doesn't clip off-screen,
               without a hard jump at a single breakpoint. */
            font-size: clamp(34px, 12vw, 56px);
            letter-spacing: 3px;
            color: var(--gold);
            text-shadow: 0 0 24px rgba(255, 209, 102, 0.35);
        }
        #title-screen .subtitle {
            margin-top: 8px;
            font-style: italic;
            opacity: 0.75;
            font-size: 16px;
        }
        #title-buttons {
            margin-top: 40px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #title-buttons button { font-size: 16px; padding: 12px 24px; }

        /* ============================================================
           Game screen (VN layer)
        ============================================================ */
        #game-screen {
            position: fixed; inset: 0;
            display: flex;
            flex-direction: column;
        }

        #hud {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            flex-wrap: wrap;
            /* Respect the phone notch / gesture-bar safe area (Phase 5). */
            padding-top: max(8px, env(safe-area-inset-top));
        }
        #hud-level { font-weight: bold; color: var(--gold); min-width: 48px; }
        #hud-day, #hud-coin {
            font-size: 11px;
            opacity: 0.85;
            padding: 2px 7px;
            border: 1px solid var(--border);
            border-radius: 999px;
            white-space: nowrap;
        }
        #hud-coin { color: var(--gold); }
        #hud-statpoints-badge {
            background: var(--gold);
            color: #1a1626;
            font-weight: bold;
            font-size: 12px;
            padding: 3px 9px;
            min-height: 32px;
            border-radius: 999px;
            border: none;
            animation: pulse 1.4s ease-in-out infinite;
        }
        #hud-statpoints-badge:hover { background: var(--accent); color: #1a1626; }
        .hud-bar-group { display: flex; align-items: center; gap: 6px; }
        .hud-bar-track {
            width: 100px; height: 10px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        #hud-hp-fill { height: 100%; background: var(--success); width: 100%; transition: width 0.3s; }
        #hud-xp-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
        #hud-hp-label { font-size: 11px; opacity: 0.8; min-width: 44px; }
        #hud-spacer { flex: 1; }
        /* HUD buttons are icon-sized labels — still comfortable to tap
           (44px min-height inherited from the base `button` rule above)
           without ballooning their footprint the way full padding would. */
        #hud button { font-size: 12px; padding: 5px 10px; min-width: 40px; }

        /* ============================================================
           Mobile pass (Phase 5): narrow-viewport layout
        ============================================================ */
        @media (max-width: 480px) {
            #hud {
                gap: 8px;
                padding: 6px 8px;
                padding-top: max(6px, env(safe-area-inset-top));
                font-size: 12px;
            }
            .hud-bar-track { width: 56px; }
            #hud-hp-label { min-width: 0; font-size: 10px; }
            #hud-day, #hud-coin { font-size: 10px; padding: 2px 5px; }
            #hud button { font-size: 11px; padding: 5px 8px; min-width: 40px; }
            /* The two bar groups + spacer wrap onto their own row under
               level/badge, then the action buttons wrap onto a third row,
               rather than clipping or squeezing unreadably thin. */
            #hud-spacer { flex-basis: 100%; height: 0; }
        }

        @media (max-width: 480px) {
            #vn-portrait {
                bottom: 132px;
                font-size: 72px;
                width: 140px;
                height: 140px;
            }
            #vn-box { padding: 14px 16px; margin-bottom: 12px; }
            #vn-text { font-size: 16px; min-height: 4.2em; }
            .vn-choice-btn { font-size: 14px; padding: 12px 14px; }
        }

        /* Short/landscape viewports (phones rotated, or a lot of browser
           chrome eating vertical space): shrink the portrait medallion and
           tighten vertical spacing so the choice buttons stay reachable
           without the page needing to scroll. */
        @media (max-height: 480px) {
            #vn-portrait {
                bottom: 96px;
                font-size: 56px;
                width: 96px;
                height: 96px;
            }
            #vn-box { padding: 10px 16px; margin-bottom: 8px; }
            #vn-text { min-height: 2.4em; }
            #vn-choices { gap: 6px; margin-top: 8px; }
            .vn-choice-btn { padding: 8px 12px; }
        }

        #vn-stage {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background-color: #1a1626;
            background-image: linear-gradient(180deg, #2b2440, #1a1626);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease;
            overflow: hidden;
        }

        /* Painterly stand-in treatment (Phase 4): a soft vignette over every
           background gradient, in place of real painted art (see
           image_prompts/ for prompts to generate that art later). */
        #vn-stage::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.45) 100%),
                linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.35));
            z-index: 1;
        }

        #vn-portrait {
            position: absolute;
            bottom: 160px;
            font-size: 110px;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: transparent;
            background-image: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.10), rgba(0,0,0,0.35) 70%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 3px solid var(--border);
            box-shadow:
                0 10px 24px rgba(0,0,0,0.55),
                0 0 0 6px rgba(224, 164, 88, 0.08),
                inset 0 0 24px rgba(0,0,0,0.4);
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
        }

        #vn-box {
            width: min(900px, 92%);
            margin-bottom: 24px;
            background: rgba(20, 16, 28, 0.92);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 22px;
            backdrop-filter: blur(2px);
            z-index: 2;
        }

        #vn-speaker {
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 6px;
            font-size: 15px;
            letter-spacing: 1px;
        }

        #vn-text {
            font-size: 17px;
            line-height: 1.5;
            min-height: 3.2em;
            cursor: pointer;
        }

        #vn-advance-hint {
            text-align: right;
            font-size: 12px;
            opacity: 0.6;
            margin-top: 6px;
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        #vn-choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .vn-choice-btn {
            text-align: left;
            font-size: 15px;
            padding: 10px 14px;
        }

        /* ============================================================
           Inventory panel
        ============================================================ */
        #inventory-panel {
            position: fixed; inset: 0;
            background: rgba(10, 8, 14, 0.75);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            z-index: 50;
        }
        #inventory-box {
            width: min(560px, 90%);
            max-height: min(70vh, 70dvh);
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #inventory-box h2 { color: var(--gold); margin-bottom: 12px; }
        .inventory-row {
            display: grid;
            grid-template-columns: 32px 140px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
        }
        .inv-icon { font-size: 20px; text-align: center; }
        .inv-name { font-weight: bold; }
        .inv-desc { opacity: 0.75; }
        .inventory-empty { opacity: 0.6; font-style: italic; padding: 12px 0; }
        #inventory-close { margin-top: 16px; }

        /* ============================================================
           Stats panel
        ============================================================ */
        #stats-panel {
            position: fixed; inset: 0;
            background: rgba(10, 8, 14, 0.75);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            z-index: 51;
        }
        #stats-box {
            width: min(480px, 90%);
            max-height: min(85vh, 85dvh);
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #stats-box h2 { color: var(--gold); margin-bottom: 8px; }
        #stats-points-remaining { font-size: 13px; opacity: 0.8; margin-bottom: 14px; }
        .stats-row {
            display: grid;
            grid-template-columns: 90px 32px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
        }
        .stats-row-label { font-weight: bold; color: var(--text); }
        .stats-row-value { color: var(--gold); font-weight: bold; text-align: center; }
        .stats-row-desc { opacity: 0.75; font-size: 12px; }
        .stats-row-btn { font-size: 15px; font-weight: bold; padding: 4px 12px; }
        #stats-close { margin-top: 16px; }

        /* ============================================================
           Brewing panel
        ============================================================ */
        #brewing-panel {
            position: fixed; inset: 0;
            background: rgba(10, 8, 14, 0.75);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            z-index: 51;
        }
        #brewing-box {
            width: min(560px, 90%);
            max-height: min(70vh, 70dvh);
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #brewing-box h2 { color: var(--gold); margin-bottom: 12px; }
        .brewing-row {
            display: grid;
            grid-template-columns: 32px 140px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
        }
        .brew-icon { font-size: 20px; text-align: center; }
        .brew-name { font-weight: bold; }
        .brew-req { opacity: 0.75; }
        .brewing-empty { opacity: 0.6; font-style: italic; padding: 12px 0; }
        #brewing-close { margin-top: 16px; }


        /* ============================================================
           Journal panel (Phase 6)
        ============================================================ */
        #journal-panel {
            position: fixed; inset: 0;
            background: rgba(10, 8, 14, 0.75);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            z-index: 51;
        }
        #journal-box {
            width: min(620px, 92%);
            max-height: min(78vh, 78dvh);
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #journal-box h2 { color: var(--gold); margin-bottom: 6px; }
        .journal-heading {
            color: var(--accent);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 16px 0 6px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 4px;
        }
        .journal-row {
            display: grid;
            grid-template-columns: 24px 160px 1fr;
            align-items: baseline;
            gap: 10px;
            padding: 7px 0;
            font-size: 13px;
        }
        .journal-mark { text-align: center; opacity: 0.8; }
        .journal-name { font-weight: bold; }
        .journal-desc { opacity: 0.78; line-height: 1.45; }
        .journal-row-done { opacity: 0.5; }
        .journal-row-done .journal-name { text-decoration: line-through; }
        .journal-row-lore .journal-desc { font-style: italic; }
        .journal-empty { opacity: 0.6; font-style: italic; padding: 6px 0; font-size: 13px; }
        #journal-close { margin-top: 18px; }
        /* A quest starting or finishing pulses the HUD button rather than
           interrupting the scene with a toast. */
        @keyframes journal-nudge-anim {
            0%, 100% { box-shadow: 0 0 0 0 rgba(224,164,88,0); }
            50%      { box-shadow: 0 0 0 4px rgba(224,164,88,0.45); }
        }
        .journal-nudge { animation: journal-nudge-anim 0.9s ease-in-out 3; }

        /* ============================================================
           Trade panel (Phase 6)
        ============================================================ */
        #trade-panel {
            position: fixed; inset: 0;
            background: rgba(10, 8, 14, 0.75);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            z-index: 51;
        }
        #trade-box {
            width: min(640px, 92%);
            max-height: min(78vh, 78dvh);
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #trade-box h2 { color: var(--gold); margin-bottom: 10px; }
        .trade-purse { float: right; font-size: 14px; color: var(--accent); }
        #trade-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
        .trade-tab { font-size: 13px; }
        .trade-tab-active { background: var(--accent); color: #1a1626; border-color: var(--accent); }
        .trade-row {
            display: grid;
            grid-template-columns: 30px 150px 1fr 52px auto;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
        }
        .trade-icon { font-size: 20px; text-align: center; }
        .trade-name { font-weight: bold; }
        .trade-desc { opacity: 0.72; }
        .trade-price { color: var(--gold); text-align: right; font-weight: bold; }
        .trade-empty { opacity: 0.6; font-style: italic; padding: 12px 0; }
        #trade-close { margin-top: 16px; }

        /* ============================================================
           Settings panel
        ============================================================ */
        #settings-panel {
            position: fixed; inset: 0;
            background: rgba(10, 8, 14, 0.75);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            z-index: 51;
        }
        #settings-box {
            width: min(440px, 90%);
            max-height: min(85vh, 85dvh);
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        #settings-box h2 { color: var(--gold); margin-bottom: 14px; }
        .settings-row {
            display: grid;
            grid-template-columns: 90px 1fr 48px;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
        }
        .settings-row label { font-weight: bold; }
        /* The native range track renders thin, but its clickable/tappable
           box should still meet the ~44px touch-target minimum (Phase 5) —
           padding grows the hit area without changing the track's look. */
        .settings-row input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            min-height: 44px;
            padding: 16px 0;
            box-sizing: border-box;
        }
        .settings-row-value { color: var(--gold); font-weight: bold; text-align: right; }
        #settings-close { margin-top: 16px; }

        /* ============================================================
           Battle screen
        ============================================================ */
        #battle-screen {
            position: fixed; inset: 0;
            background: #0c0a12;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            /* Mobile pass (Phase 5): on very short viewports the canvas +
               log + menu can exceed the available height even after the
               canvas itself shrinks — let this screen scroll rather than
               clipping the menu buttons off the bottom. */
            overflow-y: auto;
            z-index: 40;
        }
        #battle-canvas {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #14101c;
            /* The canvas keeps its internal 640x320 drawing resolution
               (battle.js draws in those coordinates) but is scaled down via
               CSS to fit small/short viewports, preserving aspect ratio. */
            width: 100%;
            max-width: 640px;
            height: auto;
            aspect-ratio: 640 / 320;
        }
        #battle-log {
            width: 640px;
            max-width: 92vw;
            height: 70px;
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            margin-top: 10px;
            flex-shrink: 0;
        }
        #battle-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        @media (max-height: 480px) {
            #battle-canvas { max-width: 420px; }
            #battle-log { height: 50px; margin-top: 6px; }
            #battle-menu { margin-top: 6px; }
        }

        /* ============================================================
           Ending screen
        ============================================================ */
        #ending-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 40%, #2b2440, #0c0a12 85%);
            text-align: center;
            padding: 24px;
            overflow-y: auto;
        }
        #ending-screen h1 { color: var(--gold); font-size: clamp(28px, 9vw, 40px); margin-bottom: 20px; }
        #ending-text { max-width: 600px; font-size: 16px; line-height: 1.6; opacity: 0.9; }
        #btn-restart { margin-top: 32px; font-size: 15px; padding: 10px 22px; }

        /* ============================================================
           Level-up toast
        ============================================================ */
        .level-up-toast {
            position: fixed;
            top: 60px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--gold);
            color: #1a1626;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
        }
        .level-up-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ============================================================
           Mobile pass (Phase 5): narrow-viewport modal layout
        ============================================================ */
        @media (max-width: 480px) {
            #inventory-box, #brewing-box, #stats-box, #settings-box { padding: 14px; }

            /* Fixed pixel columns (item name / stat label) don't leave
               enough room for the description column at ~320-360px wide;
               drop each row to two lines instead — icon+name+action on one,
               description on its own — rather than truncating text. */
            .inventory-row, .brewing-row {
                grid-template-columns: 28px 1fr auto;
                grid-template-areas:
                    "icon name action"
                    "desc desc desc";
                row-gap: 2px;
            }
            .inv-icon, .brew-icon { grid-area: icon; }
            .inv-name, .brew-name { grid-area: name; }
            .inv-desc, .brew-req { grid-area: desc; font-size: 12px; }
            .inventory-row > button, .brewing-row > .brew-btn { grid-area: action; }

            .stats-row {
                grid-template-columns: 1fr auto auto;
                grid-template-areas:
                    "label value btn"
                    "desc desc desc";
                row-gap: 2px;
            }
            .stats-row-label { grid-area: label; }
            .stats-row-value { grid-area: value; }
            .stats-row-btn { grid-area: btn; }
            .stats-row-desc { grid-area: desc; }

            .settings-row { grid-template-columns: 70px 1fr 44px; gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- ============ Title Screen ============ -->
    <div id="title-screen">
        <h1>Hearthbound</h1>
        <p class="subtitle">a cozy fantasy of apothecary shelves &amp; quiet quests</p>
        <div id="title-buttons">
            <button id="btn-new-game">New Game</button>
            <button id="btn-continue" class="hidden">Continue</button>
        </div>
    </div>

    <!-- ============ Game Screen ============ -->
    <div id="game-screen" class="hidden">
        <div id="hud">
            <span id="hud-level">Lv. 1</span>
            <span id="hud-day" title="Day of the season">Day 1</span>
            <span id="hud-coin" title="Coin">15c</span>
            <button id="hud-statpoints-badge" class="hidden" title="Spend stat points"></button>
            <div class="hud-bar-group">
                <div class="hud-bar-track"><div id="hud-hp-fill"></div></div>
                <span id="hud-hp-label">20/20</span>
            </div>
            <div class="hud-bar-group">
                <div class="hud-bar-track"><div id="hud-xp-fill"></div></div>
                <span style="opacity:0.6;">XP</span>
            </div>
            <div id="hud-spacer"></div>
            <button id="journal-open" class="hidden" title="Wisteria's Journal">📔 Journal</button>
            <button id="trade-open" class="hidden" title="Trade with Peddler Ock">🧳 Trade</button>
            <button id="brewing-open" class="hidden">🍵 Brew</button>
            <button id="inventory-open">🎒 Bag</button>
            <button id="hud-save">💾 Save</button>
            <button id="hud-mute">🔊</button>
            <button id="hud-settings" title="Settings">⚙️</button>
        </div>

        <div id="vn-stage">
            <div id="vn-portrait" class="hidden"></div>
            <div id="vn-box">
                <div id="vn-speaker" class="hidden"></div>
                <div id="vn-text"></div>
                <div id="vn-advance-hint" class="hidden">▼ click or press space to continue</div>
                <div id="vn-choices" class="hidden"></div>
            </div>
        </div>
    </div>

    <!-- ============ Inventory Panel ============ -->
    <div id="inventory-panel" class="hidden">
        <div id="inventory-box">
            <h2>Your Bag</h2>
            <div id="inventory-list"></div>
            <button id="inventory-close">Close</button>
        </div>
    </div>

    <!-- ============ Stats Panel ============ -->
    <div id="stats-panel" class="hidden">
        <div id="stats-box">
            <h2>Spend Stat Points</h2>
            <p id="stats-points-remaining"></p>
            <div id="stats-rows"></div>
            <button id="stats-close">Close</button>
        </div>
    </div>

    <!-- ============ Brewing Panel ============ -->
    <div id="brewing-panel" class="hidden">
        <div id="brewing-box">
            <h2>Brewing</h2>
            <div id="brewing-list"></div>
            <button id="brewing-close">Close</button>
        </div>
    </div>

    <!-- ============ Settings Panel ============ -->
    <!-- Journal panel (Phase 6): quests + collected lore -->
    <div id="journal-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="journal-title">
        <div id="journal-box">
            <h2 id="journal-title">Wisteria’s Journal</h2>
            <div id="journal-list"></div>
            <button id="journal-close">Close</button>
        </div>
    </div>

    <!-- Trade panel (Phase 6): Peddler Ock's cart -->
    <div id="trade-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="trade-title">
        <div id="trade-box">
            <h2 id="trade-title">Ock’s Cart <span id="trade-coin" class="trade-purse">15c</span></h2>
            <div id="trade-tabs">
                <button id="trade-tab-buy" class="trade-tab trade-tab-active">Buy</button>
                <button id="trade-tab-sell" class="trade-tab">Sell</button>
            </div>
            <div id="trade-list"></div>
            <button id="trade-close">Close</button>
        </div>
    </div>

    <div id="settings-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div id="settings-box">
            <h2 id="settings-title">Settings</h2>
            <div class="settings-row">
                <label for="settings-speed-slider">Text speed</label>
                <input type="range" id="settings-speed-slider" />
                <span id="settings-speed-label" class="settings-row-value">Normal</span>
            </div>
            <div class="settings-row">
                <label for="settings-volume-slider">Volume</label>
                <input type="range" id="settings-volume-slider" />
                <span id="settings-volume-label" class="settings-row-value">25%</span>
            </div>
            <button id="settings-close">Close</button>
        </div>
    </div>

    <!-- ============ Battle Screen ============ -->
    <div id="battle-screen" class="hidden">
        <canvas id="battle-canvas" width="640" height="320"></canvas>
        <div id="battle-log"></div>
        <div id="battle-menu"></div>
    </div>

    <!-- ============ Ending Screen ============ -->
    <div id="ending-screen" class="hidden">
        <h1>To Be Continued...</h1>
        <p id="ending-text"></p>
        <button id="btn-restart">Return to Title</button>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
