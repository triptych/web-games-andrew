<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rainglass — scene gallery</title>
<style>
    body { margin: 0; padding: 16px; background: #555; font: 13px system-ui, sans-serif; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(4, 480px); gap: 12px; }
    figure { margin: 0; }
    canvas { display: block; }
    figcaption { padding: 4px 0; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
    // Every station, early and late (with its rare curio), on a neutral background, with each
    // curio's spot circle outlined so its art can be checked against where the sim looks.
    import { paintScene, U } from '../js/view/painter.js';
    import { STATIONS } from '../js/sim/scenes.js';
    const grid = document.getElementById('grid');
    const ring = new URLSearchParams(location.search).get('rings') !== '0';
    STATIONS.forEach((s, i) => {
        for (const late of [false, true]) {
            const fig = document.createElement('figure');
            const c = document.createElement('canvas');
            c.width = 480; c.height = 360;
            const ctx = c.getContext('2d');
            ctx.drawImage(paintScene(i, late, 1), 0, 0);
            if (ring) {
                ctx.strokeStyle = 'rgba(0,255,160,0.7)';
                for (const cu of late ? [...s.curios, s.rare] : s.curios) { ctx.beginPath(); ctx.arc(cu.x * U, cu.y * U, cu.r * U, 0, Math.PI * 2); ctx.stroke(); }
            }
            fig.appendChild(c);
            const cap = document.createElement('figcaption');
            cap.textContent = `${i + 1}. ${s.name}${late ? ' · small hours' : ''}`;
            fig.appendChild(cap);
            grid.appendChild(fig);
        }
    });
    window.__galleryReady = true;
</script>
</body>
</html>
