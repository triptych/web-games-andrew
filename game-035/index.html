<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N2 Overdrive — a tube-shooter tribute</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            overscroll-behavior: none;
        }
        /* Phaser's Scale.CENTER_BOTH already centers the canvas via inline
           margins on the canvas element itself — do NOT also flex-center
           the body, or the two centering strategies stack and push the
           canvas off-screen (confirmed via mobile-viewport testing). */
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>
    <a href="../index.html" style="position:fixed;top:8px;left:8px;z-index:99999;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#fff;background:rgba(0,0,0,0.55);padding:6px 12px;border-radius:6px;text-decoration:none;pointer-events:auto;border:1px solid rgba(255,255,255,0.25);" onmouseover="this.style.background='rgba(0,0,0,0.8)'" onmouseout="this.style.background='rgba(0,0,0,0.55)'">← Games</a>
    <script type="module" src="js/main.js"></script>
</body>
</html>
