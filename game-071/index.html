<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="FROSTMARCH — Saga of the Stormsworn: an open-world fantasy RPG in three.js. Explore a frozen province, learn the dragon tongue, forge, brew, enchant, and stop the Ash-Wyrm.">
    <title>Frostmarch</title>
    <script src="../lib/page-audio.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a id="back-link" href="../index.html">← Games</a>

    <canvas id="gl"></canvas>
    <div id="fade"></div>

    <!-- ============================================================ LOADING -->
    <div id="loading" class="screen">
        <div class="logo"><span class="l1">FROSTMARCH</span><small>Saga of the Stormsworn</small></div>
        <div class="bar"><i id="load-bar"></i></div>
        <p id="load-msg">Carving the mountains…</p>
        <p id="load-tip" class="tip"></p>
    </div>

    <!-- ============================================================ TITLE -->
    <section id="title" class="screen hidden">
        <div class="logo big">
            <span class="sigil" aria-hidden="true"></span>
            <span class="l1">FROSTMARCH</span>
            <small>Saga of the Stormsworn</small>
        </div>
        <nav class="title-menu">
            <button id="t-continue" class="tbtn hidden">Continue<small id="t-cont-info"></small></button>
            <button id="t-new" class="tbtn">New Game</button>
            <button id="t-load" class="tbtn">Load</button>
            <button id="t-settings" class="tbtn">Settings</button>
            <button id="t-credits" class="tbtn">Credits</button>
        </nav>
        <p class="hint keys">WASD move · mouse look · E use · left/right click attack/block · Z sigil · Tab menu</p>
        <p class="hint touchonly">Left thumb moves · right thumb looks · tap the world to use</p>
    </section>

    <!-- ============================================================ HUD -->
    <section id="hud" class="hidden">
        <div id="compass"><div id="compass-strip"></div><div id="compass-marks"></div><i class="needle"></i></div>
        <div id="notes"></div>
        <div id="banner"><b id="banner-title"></b><small id="banner-sub"></small></div>
        <div id="enemy"><span id="enemy-name"></span><div class="ebar"><i id="enemy-fill"></i></div></div>
        <div id="crosshair"></div>
        <div id="sneak-eye"><i></i></div>
        <div id="prompt"><kbd id="prompt-key">E</kbd><span id="prompt-verb"></span><b id="prompt-name"></b><small id="prompt-sub"></small></div>
        <div id="subtitle"></div>
        <div id="bars">
            <div class="bar mag"><i id="bar-mp"></i></div>
            <div class="bar hp"><i id="bar-hp"></i></div>
            <div class="bar st"><i id="bar-sp"></i></div>
        </div>
        <div id="sigil"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" class="track"/><circle id="sigil-arc" cx="20" cy="20" r="17" class="arc"/></svg></div>
        <div id="status-icons"></div>
        <div id="debug-info" class="hidden"></div>
    </section>

    <!-- ============================================================ TOUCH -->
    <section id="touch" class="hidden">
        <div id="t-look"></div>
        <div id="t-stickzone"></div>
        <div id="t-stick"><div id="t-knob"></div></div>
        <div class="tcluster right">
            <button data-act="attack" class="tb big attack" aria-label="Attack">⚔</button>
            <button data-act="block" class="tb block" aria-label="Block or left hand">⛨</button>
            <button data-act="jump" class="tb jump" aria-label="Jump">⤒</button>
            <button data-act="sigil" class="tb sigil" aria-label="Trace sigil">ᛟ</button>
            <button data-act="use" class="tb use" id="t-use" aria-label="Use">✋</button>
        </div>
        <div class="tcluster left">
            <button data-act="sneak" class="tb small sneak" aria-label="Sneak">👁</button>
            <button data-act="camera" class="tb small cam" aria-label="Camera">◎</button>
        </div>
        <div class="tcluster top">
            <button data-act="tween" class="tb small menu" aria-label="Menu">☰</button>
            <button data-act="journal" class="tb small journal" aria-label="Journal">📜</button>
        </div>
    </section>

    <!-- ============================================================ OVERLAYS (built by js/ui) -->
    <div id="ui"></div>
    <div id="toasts"></div>

    <noscript><p class="noscript">Frostmarch needs JavaScript.</p></noscript>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
