<body>
    <a id="back" href="../index.html">← Games</a>
    <div id="stage"><canvas id="screen" aria-label="Glimmerglen game view"></canvas><canvas id="overlay" aria-hidden="true"></canvas></div>

    <!-- HUD -->
    <div id="hud" hidden>
        <div id="hud-left">
            <div id="clock"><span id="h-date"></span><span id="h-time"></span><span id="h-weather"></span></div>
            <div id="h-gold"></div>
        </div>
        <div id="hud-bars">
            <div class="bar hp"><i></i><b id="h-hp"></b></div>
            <div class="bar en"><i></i><b id="h-en"></b></div>
        </div>
        <div id="hud-btns">
            <button id="b-map" class="hudbtn" aria-label="Map">🗺</button>
            <button id="b-menu" class="hudbtn" aria-label="Menu">☰</button>
        </div>
        <div id="objective" role="status"></div>
        <div id="where"></div>
    </div>
    <div id="toasts" aria-live="polite"></div>

    <!-- touch controls -->
    <div id="touch" hidden>
        <div id="stick-zone"><div id="stick"><div id="knob"></div></div></div>
        <button id="b-a" class="tbtn" aria-label="Action">A</button>
        <button id="b-b" class="tbtn" aria-label="Run / cancel">B</button>
    </div>
    <div id="hotbar" hidden></div>

    <!-- dialog box -->
    <div id="dialog" hidden>
        <div id="dlg-box">
            <canvas id="dlg-face" width="16" height="20"></canvas>
            <div id="dlg-name"></div>
            <div id="dlg-text"></div>
            <div id="dlg-choices"></div>
            <div id="dlg-next">▼</div>
        </div>
    </div>

    <!-- modal panels -->
    <div id="panel" hidden>
        <div id="panel-sheet" role="dialog" aria-modal="true">
            <div id="panel-head"><div id="panel-tabs"></div><button id="panel-close" aria-label="Close">✕</button></div>
            <div id="panel-body"></div>
        </div>
    </div>

    <!-- battle command bar -->
    <div id="battle-ui" hidden>
        <div id="battle-log"></div>
        <div id="battle-cmds"></div>
    </div>

    <!-- full screen layers: title, creator, cutscenes -->
    <div id="screen-layer" hidden></div>
    <div id="fade"></div>
    <div id="fail" hidden></div>
    <noscript><div style="color:#fff;font-family:sans-serif;padding:32px">GLIMMERGLEN needs JavaScript.</div></noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
