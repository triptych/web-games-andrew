<body>
<a href="../index.html" class="back-link">&larr; Games</a>

<div id="title" class="overlay" hidden></div>

<div id="loading" class="overlay" hidden>
  <div class="loading-box">
    <div class="flame" aria-hidden="true"></div>
    <p>Growing a country&hellip;</p>
  </div>
</div>

<main id="game" hidden>
  <header id="topbar">
    <button class="barbtn" data-panel="inventory" aria-label="What you are carrying">&#9776;</button>
    <span id="hearts" class="hearts" aria-live="polite"></span>
    <span id="hp" class="stat"></span>
    <span id="oil" class="stat"></span>
    <span id="coin" class="stat"></span>
    <span id="clock" class="stat"></span>
    <span id="place" class="place"></span>
    <span id="statuses" class="statuses"></span>
  </header>

  <div id="stage">
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="minimap" width="128" height="128" aria-hidden="true"></canvas>
    <div id="dev" class="dev" hidden></div>
  </div>

  <div id="log" class="log" role="log" aria-live="polite" tabindex="0"></div>

  <nav id="controls">
    <div id="pad" class="pad" aria-label="Movement pad" role="application">
      <span class="pad-dot"></span>
      <span class="pad-arrow n">&#9650;</span><span class="pad-arrow s">&#9660;</span>
      <span class="pad-arrow w">&#9664;</span><span class="pad-arrow e">&#9654;</span>
    </div>

    <div class="midbtns">
      <button id="waitbtn" class="smallbtn" aria-label="Wait one turn">Wait</button>
      <button id="lanternbtn" class="smallbtn" aria-label="Light or douse the lantern">Lantern</button>
      <button class="smallbtn" data-panel="journal" aria-label="Journal">Journal</button>
      <button class="smallbtn" data-panel="map" aria-label="Map">Map</button>
      <button class="smallbtn" data-panel="character" aria-label="The keeper">Keeper</button>
      <button class="smallbtn" data-panel="ledger" aria-label="Ledger">Ledger</button>
      <button class="smallbtn" data-panel="settings" aria-label="Settings">Settings</button>
    </div>

    <div class="rightcluster">
      <div id="tools" class="tools" aria-label="Tool belt"></div>
      <button id="context" class="contextbtn" aria-label="Context action">Wait</button>
    </div>
  </nav>
</main>

<div id="dialogue" class="dialogue-host" hidden></div>
<div id="panel" class="panel-host" hidden></div>
<div id="mapscreen" class="panel-host" hidden></div>
<div id="wheel" class="wheel-host" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
